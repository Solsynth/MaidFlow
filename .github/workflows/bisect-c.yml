name: Invoke MaidCafe action

on:
  workflow_dispatch:
    inputs:
      daemon_id:
        description: MaidCafe daemon (host) id to run the action on
        required: true
        type: string
      action:
        description: Action name configured on the daemon ([[daemon.actions]])
        required: true
        type: string
      body:
        description: JSON body piped to the action on stdin (also fills {{ NAME }} script template variables)
        required: false
        default: '{}'
        type: string
      api:
        description: MaidCafe cloud base URL
        required: false
        default: https://mk.solsynth.dev
        type: string
      timeout_minutes:
        description: Max minutes to wait for the daemon to pick up and finish the action
        required: false
        default: '10'
        type: string
permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    outputs:
      result_code: ${{ steps.result.outputs.result_code }}
      result_body: ${{ steps.result.outputs.result_body }}
    steps:
      - name: Enqueue action on the MaidCafe cloud relay
        id: enqueue
        env:
          API: ${{ inputs.api }}
          TOKEN: ${{ secrets.MAIDCAFE_TOKEN }}
          DAEMON_ID: ${{ inputs.daemon_id }}
          ACTION: ${{ inputs.action }}
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          encoded=$(printf '%s' "$BODY" | base64 -w0)
          resp=$(curl -fsS -X POST "$API/api/daemons/$DAEMON_ID/webhook-requests" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$ACTION\",\"body\":\"$encoded\"}")
          request_id=$(printf '%s' "$resp" | jq -r '.id')
          printf 'enqueued request %s (action=%s, daemon=%s)\n' "$request_id" "$ACTION" "$DAEMON_ID"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the daemon to execute and report the result
        id: result
        env:
          API: ${{ inputs.api }}
          TOKEN: ${{ secrets.MAIDCAFE_TOKEN }}
          DAEMON_ID: ${{ inputs.daemon_id }}
          REQUEST_ID: ${{ steps.enqueue.outputs.request_id }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          resp=''
          status=pending
          while : ; do
            resp=$(curl -fsS "$API/api/daemons/$DAEMON_ID/webhook-requests/$REQUEST_ID" \
              -H "Authorization: Bearer $TOKEN")
            status=$(printf '%s' "$resp" | jq -r '.status')
            [ "$status" = "done" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::action not completed within ${TIMEOUT_MINUTES} minutes (status=$status); the daemon polls the relay once a minute"
              exit 1
            fi
            sleep 5
          done
          code=$(printf '%s' "$resp" | jq -r '.result_code // 0')
          err=$(printf '%s' "$resp" | jq -r '.result_error // ""')
          body=$(printf '%s' "$resp" | jq -r '.result_body // ""')
          printf 'status=%s result_code=%s\n' "$status" "$code"
          if [ -n "$err" ]; then
            printf 'relay error: %s\n' "$err"
          fi
          if [ -n "$body" ]; then
            printf 'stdout:\n%s\n' "$(printf '%s' "$body" | base64 -d 2>/dev/null || printf '%s' "$body")"
          fi
          echo "result_code=$code" >> "$GITHUB_OUTPUT"
          echo "result_body=$body" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 200 ] || [ -n "$err" ]; then
            echo "::error::action failed (result_code=$code, error=$err)"
            exit 1
          fi
